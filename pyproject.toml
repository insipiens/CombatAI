[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dcs-radio-voice-control"
version = "0.1.0"
description = "Deterministic voice control for DCS radio and mission menus"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "DCS Radio Voice Control contributors"}]
dependencies = []

[project.scripts]
dcs-radio-voice-control-menu = "dcs_radio_voice_control.console:main"
dcs-radio-voice-control-microphone = "dcs_radio_voice_control.microphone:main"
dcs-radio-voice-control-recording-test = "dcs_radio_voice_control.recording_test:main"
dcs-radio-voice-control-transcription-test = "dcs_radio_voice_control.transcription_test:main"
dcs-radio-voice-control-matching-test = "dcs_radio_voice_control.matching_test:main"
dcs-radio-voice-control-voice-command-test = "dcs_radio_voice_control.voice_command_test:main"
dcs-radio-voice-control-configuration = "dcs_radio_voice_control.configuration_ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
