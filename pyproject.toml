[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "combatai"
version = "0.1.0"
description = "A lightweight voice interface for DCS World in VR"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "CombatAI contributors"}]
dependencies = []

[project.scripts]
combatai-menu = "combatai.console:main"
combatai-microphone = "combatai.microphone:main"
combatai-recording-test = "combatai.recording_test:main"
combatai-transcription-test = "combatai.transcription_test:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
